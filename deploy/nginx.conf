# 웹 앱과 API 를 **한 오리진**으로 내보낸다.
#
# 따로 두면(웹은 Pages, API 는 터널) 두 주소가 다른 사이트가 되어, 리프레시 쿠키
# (SameSite=Lax · path=/api/auth)가 웹의 XHR 에 실리지 않는다 — 웹에서 15분마다
# 로그인이 풀린다. 같은 오리진이면 CORS 도 필요 없다.

server {
  listen 80;
  server_name _;

  # 첨부 상한(attachments.service.ts 의 MAX_UPLOAD_BYTES = 25MB)보다 조금 넉넉히.
  # nginx 기본값(1MB)이면 서버가 판단하기 전에 413 이 나 앱이 이유를 모른다.
  client_max_body_size 26m;
  server_tokens off;

  location /api/ {
    proxy_pass http://server:3000;
    proxy_set_header Host $host;
    # 클라이언트 IP 는 Cloudflare 가 붙이는 Cf-Connecting-IP 하나만 믿는다. 이 nginx 는
    # 밖으로 포트를 열지 않고 터널로만 닿으므로 이 헤더를 지어낼 길이 없다. 서버는
    # TRUST_PROXY=1 로 바로 앞 홉(이 nginx)이 준 값을 req.ip 로 읽는다.
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    proxy_set_header X-Forwarded-Proto https;
    # 업로드를 nginx 가 디스크에 모았다 넘기지 않게 — 서버가 상한을 직접 판정한다.
    proxy_request_buffering off;
    # 첨부 다운로드를 스트리밍 그대로 흘린다.
    proxy_buffering off;
  }

  location /socket.io/ {
    proxy_pass http://server:3000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $http_cf_connecting_ip;
    # 소켓은 오래 산다. 기본 60초면 조용한 채널의 연결이 1분마다 끊겼다 붙는다
    # (socket.io 의 핑이 25초라 실제로는 그 안에 트래픽이 있지만 여유를 둔다).
    proxy_read_timeout 1h;
  }

  location / {
    root /usr/share/nginx/html;
    # 해시 주소(/#/s/...)가 기본이지만, 경로 주소로 바뀌어도 새로고침이 404 가 되지 않게.
    try_files $uri $uri/ /index.html;

    # **Flutter 웹 산출물은 파일 이름에 해시가 없다**(main.dart.js · flutter_bootstrap.js ·
    # assets/). 캐시를 허락하면 배포 뒤에도 옛 main.dart.js 가 남는다 — 개발 중
    # python http.server 에서 실제로 겪었다(CLAUDE.md §2). no-cache 는 「저장하되 매번
    # 확인」이라 ETag 가 같으면 304 로 끝나 비용이 작다.
    add_header Cache-Control "no-cache" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
  }
}
