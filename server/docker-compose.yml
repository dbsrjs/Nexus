services:
  postgres:
    image: postgres:16
    container_name: onework-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: onework
      POSTGRES_USER: onework
      POSTGRES_PASSWORD: onework
    ports:
      - "5432:5432"
    volumes:
      - onework-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: onework-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

  minio:
    image: minio/minio
    container_name: onework-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - onework-minio-data:/data

volumes:
  onework-postgres-data:
  onework-minio-data:
