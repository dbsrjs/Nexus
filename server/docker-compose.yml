# 로컬 개발용 백엔드 서비스. 배포 구성은 deploy/docker-compose.prod.yml 이다.
#
# `npm run db:up:docker` 는 **postgres 하나만** 띄운다. redis · s3 는 프로필
# 뒤에 있어 기본으로 뜨지 않는다 — 지금 빌드가 둘 다 쓰지 않기 때문이다.
# 그대로 두면 새 PC 에서 쓰지도 않는 컨테이너가 6379 · 8333 을 잡는다.
#
#   docker compose -f server/docker-compose.yml --profile redis up -d
#   docker compose -f server/docker-compose.yml --profile s3    up -d
#   docker compose -f server/docker-compose.yml --profile voice up -d   # 음성 채널(20단계)
services:
  # pgvector 확장이 포함된 Postgres 이미지.
  # 순정 postgres:16 을 쓰면 repo_index_chunks 의 vector 컬럼을 만들 수 없어
  # init 마이그레이션이 CREATE EXTENSION 에서 실패한다 (docs/백엔드-설계.md §1).
  postgres:
    image: pgvector/pgvector:pg16
    container_name: nexus-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: nexus
      POSTGRES_USER: nexus
      POSTGRES_PASSWORD: nexus
    ports:
      - "5432:5432"
    volumes:
      - nexus-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nexus -d nexus"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ⚠ 현재 빌드는 Redis 를 쓰지 않는다. redis-io.adapter.ts 는 tsconfig 의
  #   exclude 에 있고 main.ts 에 등록되지 않았다. 10-3a 에서 열람 캐시를
  #   검토하며 "Redis 가 이 프로젝트에 없다"고 못 박았다 (docs/진행-기록.md «10-3a»).
  #   프레즌스나 다중 인스턴스가 실제로 필요해지면 그때 프로필을 뗀다.
  redis:
    image: redis:7
    container_name: nexus-redis
    restart: unless-stopped
    profiles: ["redis"]
    ports:
      - "6379:6379"

  # ⚠ 개발 루프는 STORAGE_DRIVER=local 이라 이것도 뜨지 않는다. 8-1 에서
  #   "S3 를 개발 루프에 들이지 않는다"고 정했다 — 배포는 R2 를 쓰고, S3 경로를
  #   손으로 확인할 때만 이 프로필을 켠다(CI 는 push 마다 같은 이미지로 확인한다).
  #
  #   MinIO 였는데 **Docker Hub 의 minio/minio 가 사라져** 받아지지 않았다(2026-10-09).
  #   SeaweedFS 로 바꿨다. 키는 docker/seaweedfs-s3.json 의 개발용 값이다:
  #     STORAGE_DRIVER=s3  STORAGE_ENDPOINT=http://127.0.0.1:8333
  #     STORAGE_ACCESS_KEY=nexus-dev  STORAGE_SECRET_KEY=nexus-dev-secret
  #   버킷은 node scripts/s3-bucket.mjs 로 만든다.
  s3:
    image: chrislusf/seaweedfs:4.48
    container_name: nexus-s3
    restart: unless-stopped
    profiles: ["s3"]
    command: server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
    ports:
      - "8333:8333"
    volumes:
      - ./docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro
      - nexus-s3-data:/data

  # 음성 채널의 미디어 서버(20단계). 통화를 만지는 날에만 켠다 — 다른 기능은 이것 없이 돈다.
  # server/.env 의 LIVEKIT_URL=ws://127.0.0.1:7880 · LIVEKIT_API_KEY=devkey ·
  # LIVEKIT_API_SECRET 은 docker/livekit.yaml 의 개발값과 같아야 한다(.env.example 에 있다).
  livekit:
    image: livekit/livekit-server:v1.9.1
    container_name: nexus-livekit
    restart: unless-stopped
    profiles: ["voice"]
    command: --config /etc/livekit.yaml
    ports:
      - "7880:7880"        # 시그널(WebSocket) · 서버 API
      - "7881:7881"        # 미디어 TCP — UDP 가 막힌 망
      - "7882:7882/udp"    # 미디어 UDP
    # 웹훅이 호스트의 server:dev 로 간다. Docker Desktop 은 이 이름을 원래 알지만 Linux 는 모른다.
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./docker/livekit.yaml:/etc/livekit.yaml:ro

volumes:
  nexus-postgres-data:
  nexus-s3-data:
