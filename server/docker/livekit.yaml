# 개발 · CI 용 LiveKit 설정(20단계). 배포는 deploy/livekit.yaml 이다.
#
# **키는 개발용 가짜값이다** — server/.env.example · CI 와 같은 값. 공개 저장소에 있으니 배포에 쓰지 않는다.
port: 7880
rtc:
  tcp_port: 7881
  # 미디어 UDP 를 포트 하나로 받는다 — 범위(50000~60000)를 Docker 로 매핑하면 느리고 방화벽 규칙도 길다.
  udp_port: 7882
  # 앱에게 알려 줄 주소. 개발은 같은 PC 라 루프백이다. Android 에뮬레이터 · 다른 기기로 시험하려면
  # 이 PC 의 LAN 주소로 바꾼다(에뮬레이터에게 127.0.0.1 은 자기 자신이다 — CLAUDE.md §1).
  node_ip: 127.0.0.1
  use_external_ip: false
keys:
  devkey: nexus-dev-livekit-secret-0123456789
webhook:
  api_key: devkey
  urls:
    # 컨테이너 밖(호스트)의 server:dev. compose 의 extra_hosts 가 이 이름을 호스트로 잇는다.
    - http://host.docker.internal:3000/api/voice/webhook
logging:
  level: info
