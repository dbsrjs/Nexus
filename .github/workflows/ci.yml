name: CI

# 서버와 앱을 **병렬로** 돌린다. 둘은 서로를 필요로 하지 않고,
# 한쪽이 깨져도 다른 쪽 결과를 봐야 원인을 좁힐 수 있다.
on:
  push:
    # feat 만 두었다가 chore 브랜치에서 CI 가 조용히 안 도는 일을 겪었다.
    branches: [main, 'feat/**', 'fix/**', 'chore/**']
  pull_request:
  workflow_dispatch:

# **Flutter 버전을 고정한다.** channel: stable 만 두면 CI 만 늘 최신을 쓰게 되어,
# 어느 개발 PC 에서도 재현되지 않는 실패가 CI 에서만 난다.
#
# 값은 **개발에 쓰는 것 중 가장 낮은 버전**이다. CI 가 하한선을 지켜야
# 새 SDK 의 API 를 쓴 코드가 낮은 PC 에서 깨지는 것을 여기서 잡는다.
# 올릴 때는 모든 개발 PC 를 함께 올리고 이 값을 고칠 것. 앱 잡과 통합 잡이 함께 쓴다.
env:
  FLUTTER_VERSION: 3.44.9

jobs:
  server:
    name: 서버 (lint · build · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # Prisma Client 는 생성물이라 저장소에 없다. 이걸 빠뜨리면 타입이 전부
      # 깨지므로 lint·build·test 보다 먼저 돌린다.
      - name: Prisma Client 생성
        run: npm run prisma:generate

      # Prisma 는 스키마로 표현하지 못하는 것(pgvector HNSW 인덱스)을 드리프트로
      # 오인해 삭제 구문을 끼워 넣는다. 7-1 · 7-3 · 9-1 · 9-2a 에서 네 번 겪었고
      # 매번 사람이 눈으로 잡았다. 인덱스가 없어도 쿼리는 돌기 때문에 놓치면
      # 조용히 느려질 뿐이라, 사람 눈 대신 여기서 잡는다.
      - name: 마이그레이션에 수동 관리 객체 삭제가 섞였는지 검사
        run: node scripts/check-migrations.mjs

      # raw SQL 이 now() 를 쓰면 DB 의 로컬 시간이 들어오는데, Prisma 는 같은
      # 컬럼(timestamp without time zone)에 UTC 를 쓴다. 개발 PC 가 Asia/Seoul
      # 이라 아홉 시간이 어긋나 인덱싱 리스가 한 번도 동작하지 않았다(2026-09-10).
      # CI 가 UTC 면 로컬에서만 틀리고 여기는 초록이라, 값이 아니라 코드를 본다.
      - name: raw SQL 이 DB 시계를 쓰는지 검사
        run: node scripts/check-sql-time.mjs

      # eslint 는 서식 규칙을 prettier 에 넘기고 꺼 두었다(eslint-config-prettier). 그런데
      # prettier 를 아무도 돌리지 않아 69개 파일이 어긋나 있었다(2026-10-06 정렬).
      - run: npm run format:check

      - run: npm run lint

      - run: npm run build

      - run: npm test

  app:
    name: 앱 (analyze · test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app

    steps:
      - uses: actions/checkout@v7

      # 버전은 위 env.FLUTTER_VERSION 한곳에서 정한다.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - run: flutter pub get

      # freezed · json_serializable 산출물은 커밋돼 있지만, 모델을 고치고
      # 재생성을 빠뜨린 경우를 여기서 잡는다.
      - name: 코드 생성 결과가 최신인지 확인
        run: |
          dart run build_runner build --delete-conflicting-outputs
          git diff --exit-code -- lib || {
            echo "::error::생성 코드가 최신이 아닙니다. 'dart run build_runner build' 후 커밋하십시오."
            exit 1
          }

      - run: flutter analyze

      - run: flutter test

  server-integration:
    # 이름에 개수를 넣지 않는다 — 스크립트를 더할 때마다 어긋났다(「20종」이던 동안 실제는 19종).
    # 앱 흐름(app:flow)도 여기서 돈다 — 같은 DB · 서버를 쓰므로 잡을 따로 두면 그 준비를 두 번 한다.
    name: 통합 (계약 검증 · 앱 흐름)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server

    # 순정 postgres 를 쓰면 init 마이그레이션이 CREATE EXTENSION "vector" 에서
    # 죽는다. docker-compose.yml 과 같은 이미지를 쓴다.
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: nexus
          POSTGRES_USER: nexus
          POSTGRES_PASSWORD: nexus
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nexus -d nexus"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    # **전부 검증 전용 가짜값이다. secrets 를 쓰지 않는다.**
    # secrets 에 넣으면 포크에서 온 PR 이 조용히 못 돌고, 새 PC 에서 재현도
    # 안 된다. 그리고 가짜값을 secrets 에 두는 것 자체가 "여기 진짜 비밀이
    # 있다"는 잘못된 신호가 되어, 나중에 누군가 그 자리에 진짜 키를 넣는다.
    # 이 DB 는 잡이 끝나면 사라진다.
    env:
      DATABASE_URL: postgresql://nexus:nexus@127.0.0.1:5432/nexus
      # 32자 미만이면 서버가 부팅을 거부한다(jwt.config.ts).
      JWT_SECRET: nM31nP4SCY7cbL8jVTdQ3E72yaK4VocwQ0a6ZHAW2d-XruMK0rc3xThqEFVr0_CF
      JWT_REFRESH_SECRET: vUs9kRXk8kJd1aLjV86t01pvGFeWyae9lx7Puut1WY8ow64l9Ai8GGLCKGTvXeNk
      JWT_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGINS: http://localhost:5173
      COOKIE_SECURE: 'false'
      STORAGE_DRIVER: local
      STORAGE_LOCAL_DIR: /tmp/nexus-storage
      GITHUB_CLIENT_ID: check-client-id
      GITHUB_CLIENT_SECRET: check-client-secret
      GITHUB_CALLBACK_URL: http://127.0.0.1:3000/api/auth/github/callback
      # check:oauth · check:browse 가 이 포트에 가짜 GitHub 을 스스로 띄운다.
      GITHUB_OAUTH_BASE: http://127.0.0.1:4599
      GITHUB_API_BASE: http://127.0.0.1:4599
      # 32바이트 base64url. 길이가 틀리면 부팅이 멈춘다.
      OAUTH_TOKEN_KEY: 28zA3oxkP03A-XaFJAa95xge7vGvgYjBQIQRmdUqBv4
      # 가짜 GitHub 이 훅 URL 을 검사하지 않으므로 아무 http 주소면 된다.
      # 비우면 check:oauth · check:browse 가 준비 단계에서 중단된다.
      PUBLIC_BASE_URL: http://127.0.0.1:3000
      # 인덱싱 검증은 결정적 임베딩을 쓴다. 진짜 provider 를 부르면 CI 가
      # 외부 API 키에 묶인다 (설계 §8).
      EMBEDDING_PROVIDER: fake
      # AI 검증(check:ai)은 결정적 응답이 필요하다 - promptHash 캐시 적중을
      # 확인하려면 같은 입력에 같은 출력이 와야 한다 (설계 §12).
      LLM_PROVIDER: fake
      # 시드 계정으로 로그인하는 검증은 이제 없다(2026-09-17 에 check:realtime
      # 도 자체 계정으로 바꿨다). 그래도 두는 이유는 비우면 시드가 임의
      # 비밀번호를 만들어 **공개 CI 로그에 찍기** 때문이다.
      SEED_PASSWORD: ci-seed-password-1234
      PORT: '3000'

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: server/package-lock.json

      - run: npm ci

      # Prisma Client 는 생성물이라 저장소에 없다.
      - run: npm run prisma:generate

      - run: npm run prisma:deploy

      - run: npm run seed

      - run: npm run build

      # 앱 흐름용. 서버를 띄우기 전에 받아 둔다 — 여기서 실패하면 앱 코드와 무관한
      # 준비 실패라는 것이 단계 이름으로 바로 보인다.
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          cache: true

      - name: 앱 의존성
        working-directory: app
        run: flutter pub get

      # **빌드본을 띄운다(start:dev 가 아니다).** enableBigIntSerialization() ·
      # rawBody: true · 전역 파이프 · 전역 예외 필터가 전부 main.ts 에 있고,
      # 이 층이 존재하는 이유가 그것을 태우는 것이다. CLAUDE.md §6 의 BigInt
      # 버그도 10-3a 의 Retry-After 결함도 정확히 그 자리에 있었다.
      #
      # 로그를 파일로 돌리는 것은 취향이 아니다 — stdout 을 잡고 있으면 이
      # 단계가 끝나지 않는다.
      - name: 서버 기동
        run: node dist/main > /tmp/server.log 2>&1 &

      # 고정 sleep 을 쓰지 않는다 — 느린 러너에서 먼저 깨지고 빠른 러너에서는
      # 시간을 버린다.
      - name: 서버가 응답할 때까지 대기
        id: server
        run: |
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 2 http://127.0.0.1:3000/api/me || true)
            if [ "$code" != "000" ]; then
              echo "준비됨 (HTTP $code, ${i}회 시도)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::서버가 60초 안에 응답하지 않았습니다"
          cat /tmp/server.log
          exit 1

      # 정적 검사 둘(check:migrations · check:sql-time)은 여기서 돌리지 않는다 —
      # DB 도 서버도 필요 없어 서버 잡이 이미 돌린다. 같은 커밋에 두 번 돌 이유가 없다.
      - name: 계약 검증
        run: |
          set -e
          echo "── check:realtime ──"
          node scripts/check-realtime.mjs
          for s in reactions threads quotes mentions pins attachments issues repos oauth browse pulls indexing ai settings members dm presence notifications; do
            echo "── check:$s ──"
            node "scripts/check-$s.mjs"
          done

      # **창 없이 flutter_tester 로 돈다.** 앱에 linux/ 플랫폼이 없지만, 이 흐름은 보안
      # 저장소 · drift 를 메모리로 덮어써 플랫폼 플러그인을 부르지 않으므로 창이 필요 없다.
      # 계약 검증이 실패해도 돈다 — 서버가 떠 있으면 앱 쪽 결과도 따로 봐야 원인을 좁힌다.
      - name: 앱 흐름 (app:flow 헤드리스)
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        working-directory: app
        run: flutter test integration_test -d flutter-tester

      # **S3 드라이버를 실제 S3 호환 저장소로 태운다.** 개발 루프는 local 이라(8-1) 여기서
      # 돌리지 않으면 운영(R2)에서 처음 실행된다. 같은 서버를 STORAGE_DRIVER=s3 로 다시 띄워
      # 바이트를 저장소에 두는 두 갈래(첨부 · 아바타)만 다시 돈다. SeaweedFS 인 이유는
      # server/docker-compose.yml 의 s3 프로필 주석(minio/minio 가 Docker Hub 에서 사라졌다).
      - name: S3 드라이버 (SeaweedFS 로 첨부 · 아바타)
        if: ${{ !cancelled() && steps.server.outcome == 'success' }}
        env:
          STORAGE_DRIVER: s3
          STORAGE_ENDPOINT: http://127.0.0.1:8333
          STORAGE_ACCESS_KEY: nexus-dev
          STORAGE_SECRET_KEY: nexus-dev-secret
          STORAGE_BUCKET: nexus-attachments
        run: |
          docker run -d --name s3 -p 8333:8333 \
            -v "$PWD/docker/seaweedfs-s3.json:/etc/seaweedfs/s3.json:ro" \
            chrislusf/seaweedfs:4.48 server -s3 -s3.config=/etc/seaweedfs/s3.json -dir=/data
          # 게이트웨이가 뜨는 데 몇 초 걸린다. 버킷이 만들어질 때까지가 준비다.
          for i in $(seq 1 60); do node scripts/s3-bucket.mjs 2>/dev/null && break; sleep 1; done

          pkill -f "node dist/main" || true
          sleep 1
          node dist/main > /tmp/server-s3.log 2>&1 &
          for i in $(seq 1 60); do
            code=$(curl -s -o /dev/null -w "%{http_code}" -m 2 http://127.0.0.1:3000/api/me || true)
            [ "$code" != "000" ] && break
            sleep 1
          done
          # 드라이버가 정말 s3 로 떴고 버킷에 닿았는지부터 본다 — local 로 떨어진 채
          # 아래 검증이 통과하면 이 단계는 아무것도 증명하지 않는다.
          grep -q "S3 버킷 확인" /tmp/server-s3.log || { cat /tmp/server-s3.log; exit 1; }
          node scripts/check-attachments.mjs
          node scripts/check-settings.mjs

      # 없으면 CI 의 빨간 X 를 보고도 원인을 못 찾는다. 2026-08-21 에
      # PUBLIC_BASE_URL 하나로 37개가 무너졌을 때, 원인은 서버가 준 400 응답
      # 본문 안에만 있었다.
      - name: 실패 시 서버 로그
        if: failure()
        run: cat /tmp/server.log /tmp/server-s3.log 2>/dev/null || true
