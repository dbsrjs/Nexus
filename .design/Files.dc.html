<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #77AECF; text-decoration: none; }
    a:hover { color: #5197C2; text-decoration: underline; }
    ::selection { background: rgba(119,174,207,.28); }
  </style>
</helmet>

<div style="width: 1280px; height: 800px; display: flex; background: #121314; color: #DDE6ED; font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;">

  <!-- 레일 -->
  <div style="width: 68px; flex: none; background: #0D0E0F; display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 8px;">
    <div style="position: relative; display: flex; align-items: center;">
      <div style="position: absolute; left: -14px; top: 7px; bottom: 7px; width: 3px; background: #DDE6ED; border-radius: 0 3px 3px 0;"></div>
      <div style="width: 40px; height: 40px; border-radius: 11px; background: #77AECF; color: #121314; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px;">N</div>
    </div>
    <div style="width: 40px; height: 40px; border-radius: 11px; background: #1C1D1F; color: #9DA0A4; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px;">L</div>
    <div style="flex: 1;"></div>
    <div style="position: relative;">
      <div style="width: 34px; height: 34px; border-radius: 9999px; background: #90A8C1; color: #121314; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;">이윤</div>
      <div style="position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 9999px; background: #74B48F; border: 2.5px solid #0D0E0F;"></div>
    </div>
  </div>

  <!-- 두 번째 판 -->
  <div style="width: 244px; flex: none; background: #1C1D1F; display: flex; flex-direction: column; overflow: hidden;">
    <div style="height: 56px; flex: none; display: flex; align-items: center; padding: 0 16px; gap: 8px;">
      <span style="font-size: 15.5px; font-weight: 700; letter-spacing: -.015em;">Nexus</span>
      <svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor" style="color: #63676B;"><path d="M2.5 4.5h7L6 9 2.5 4.5z"/></svg>
    </div>
    <div style="flex: 1; padding: 2px 8px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <div style="padding: 0 8px 7px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: #63676B;">개발</div>
        <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 9px; border-radius: 8px;">
          <span style="color: #63676B; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1;">#</span>
          <span style="font-size: 13.5px; color: #9DA0A4;">개발</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 9px; border-radius: 8px;">
          <span style="color: #63676B; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1;">#</span>
          <span style="font-size: 13.5px; color: #DDE6ED; font-weight: 600;">nexus</span>
          <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; background: #77AECF; color: #121314; font-weight: 700; border-radius: 9999px; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; padding: 0 5px;">3</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <div style="padding: 0 8px 7px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: #63676B;">작업</div>
        <div style="display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 9px; border-radius: 8px;">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#63676B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><rect x="2" y="2.5" width="4" height="11" rx="1"/><rect x="7.5" y="2.5" width="4" height="7" rx="1"/></svg>
          <span style="font-size: 13.5px; color: #9DA0A4;">이슈 보드</span>
        </div>
        <div style="display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 9px; border-radius: 8px;">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#63676B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M2 13V3M2 13h12M4.5 10.5l3-3 2.5 2 4-4.5"/></svg>
          <span style="font-size: 13.5px; color: #9DA0A4;">스프린트</span>
        </div>
        <div style="position: relative; display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 9px; border-radius: 8px; background: rgba(119,174,207,.13);">
          <div style="position: absolute; left: 0; top: 6px; bottom: 6px; width: 2.5px; background: #77AECF; border-radius: 0 2px 2px 0;"></div>
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#77AECF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M2.5 4.5A1.5 1.5 0 014 3h2.5L8 4.5h4A1.5 1.5 0 0113.5 6v6A1.5 1.5 0 0112 13.5H4A1.5 1.5 0 012.5 12V4.5z"/></svg>
          <span style="font-size: 13.5px; color: #DDE6ED; font-weight: 600;">파일</span>
          <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #9DA0A4;">24</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 본문 : 파일 -->
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: #121314;">

    <div style="height: 56px; flex: none; display: flex; align-items: center; gap: 11px; padding: 0 20px; border-bottom: 1px solid rgba(221,230,237,.10);">
      <span style="font-size: 15.5px; font-weight: 700; letter-spacing: -.01em;">파일</span>
      <span style="font-size: 12.5px; color: #63676B;">이 스페이스에서 주고받은 것 전부</span>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
        <div style="display: flex; align-items: center; gap: 8px; width: 200px; height: 30px; padding: 0 11px; border-radius: 8px; background: #1C1D1F;">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#63676B" stroke-width="1.7" stroke-linecap="round"><circle cx="7" cy="7" r="4.5"/><path d="M10.5 10.5L14 14"/></svg>
          <span style="font-size: 12.5px; color: #63676B;">파일 찾기</span>
        </div>
        <div style="display: flex; padding: 2px; border-radius: 9px; background: #1C1D1F;">
          <div style="width: 28px; height: 26px; border-radius: 7px; background: #282A2C; display: flex; align-items: center; justify-content: center; color: #DDE6ED;">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7"><rect x="2" y="2" width="5" height="5" rx="1"/><rect x="9" y="2" width="5" height="5" rx="1"/><rect x="2" y="9" width="5" height="5" rx="1"/><rect x="9" y="9" width="5" height="5" rx="1"/></svg>
          </div>
          <div style="width: 28px; height: 26px; border-radius: 7px; display: flex; align-items: center; justify-content: center; color: #63676B;">
            <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"><path d="M2 4h12M2 8h12M2 12h12"/></svg>
          </div>
        </div>
      </div>
    </div>

    <div style="flex: 1; min-height: 0; padding: 20px 24px; display: flex; flex-direction: column; gap: 18px; overflow: hidden;">

      <div style="display: flex; align-items: center; gap: 12px;">
        <span style="font-size: 12.5px; font-weight: 600; color: #9DA0A4;">이번 주</span>
        <div style="flex: 1; height: 1px; background: rgba(221,230,237,.10);"></div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px;">

        <!-- 이미지 : 비율을 미리 잡아 로드 때 튀지 않는다 -->
        <div style="display: flex; flex-direction: column; gap: 9px;">
          <div style="aspect-ratio: 4 / 3; border-radius: 10px; background: #1C1D1F; overflow: hidden; position: relative; display: flex; align-items: center; justify-content: center;">
            <svg viewBox="0 0 200 150" style="width: 100%; height: 100%; display: block;">
              <rect width="200" height="150" fill="#282A2C"/>
              <rect x="18" y="20" width="164" height="10" rx="3" fill="#63676B" opacity=".55"/>
              <rect x="18" y="42" width="120" height="8" rx="3" fill="#63676B" opacity=".35"/>
              <polyline points="18,120 52,92 78,104 112,66 146,88 182,58" fill="none" stroke="#77AECF" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
              <line x1="18" y1="132" x2="182" y2="132" stroke="#63676B" stroke-width="1.5" opacity=".5"/>
            </svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <div style="font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">번다운-스프린트3.png</div>
            <div style="font-size: 11.5px; color: #63676B;">이윤건 · 2시간 전 · 148 KiB</div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 9px;">
          <div style="aspect-ratio: 4 / 3; border-radius: 10px; background: #1C1D1F; overflow: hidden;">
            <svg viewBox="0 0 200 150" style="width: 100%; height: 100%; display: block;">
              <rect width="200" height="150" fill="#282A2C"/>
              <rect x="0" y="0" width="200" height="26" fill="#1C1D1F"/>
              <circle cx="14" cy="13" r="4" fill="#D47D7D"/><circle cx="28" cy="13" r="4" fill="#D3B069"/><circle cx="42" cy="13" r="4" fill="#74B48F"/>
              <rect x="14" y="42" width="76" height="7" rx="2" fill="#77AECF" opacity=".8"/>
              <rect x="14" y="58" width="132" height="7" rx="2" fill="#63676B" opacity=".5"/>
              <rect x="24" y="74" width="108" height="7" rx="2" fill="#74B48F" opacity=".6"/>
              <rect x="24" y="90" width="88" height="7" rx="2" fill="#63676B" opacity=".5"/>
              <rect x="14" y="106" width="60" height="7" rx="2" fill="#63676B" opacity=".5"/>
            </svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <div style="font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">CI-실패-로그.png</div>
            <div style="font-size: 11.5px; color: #63676B;">김서연 · 5시간 전 · 92 KiB</div>
          </div>
        </div>

        <!-- 이미지가 아닌 파일 -->
        <div style="display: flex; flex-direction: column; gap: 9px;">
          <div style="aspect-ratio: 4 / 3; border-radius: 10px; background: #1C1D1F; display: flex; align-items: center; justify-content: center;">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
              <svg width="34" height="34" viewBox="0 0 16 16" fill="none" stroke="#63676B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.5h5L13 5.5V14a.5.5 0 01-.5.5h-9A.5.5 0 013 14V2a.5.5 0 01.5-.5H4z"/><path d="M9 1.5V5.5H13"/></svg>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .06em; color: #63676B;">PDF</span>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <div style="font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">백엔드-설계-검토본.pdf</div>
            <div style="font-size: 11.5px; color: #63676B;">박민준 · 어제 · 1.2 MiB</div>
          </div>
        </div>

        <div style="display: flex; flex-direction: column; gap: 9px;">
          <div style="aspect-ratio: 4 / 3; border-radius: 10px; background: #1C1D1F; display: flex; align-items: center; justify-content: center;">
            <div style="display: flex; flex-direction: column; align-items: center; gap: 8px;">
              <svg width="34" height="34" viewBox="0 0 16 16" fill="none" stroke="#63676B" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M4 1.5h5L13 5.5V14a.5.5 0 01-.5.5h-9A.5.5 0 013 14V2a.5.5 0 01.5-.5H4z"/><path d="M9 1.5V5.5H13"/><path d="M6 9l-1.5 1.5L6 12M10 9l1.5 1.5L10 12"/></svg>
              <span style="font-family: 'JetBrains Mono', monospace; font-size: 10.5px; letter-spacing: .06em; color: #63676B;">MJS</span>
            </div>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <div style="font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">preflight.mjs</div>
            <div style="font-size: 11.5px; color: #63676B;">이윤건 · 어제 · 2.4 KiB</div>
          </div>
        </div>
      </div>

      <div style="display: flex; align-items: center; gap: 12px; margin-top: 4px;">
        <span style="font-size: 12.5px; font-weight: 600; color: #9DA0A4;">지난주</span>
        <div style="flex: 1; height: 1px; background: rgba(221,230,237,.10);"></div>
      </div>

      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 14px;">
        <div style="display: flex; flex-direction: column; gap: 9px;">
          <div style="aspect-ratio: 4 / 3; border-radius: 10px; background: #1C1D1F; overflow: hidden;">
            <svg viewBox="0 0 200 150" style="width: 100%; height: 100%; display: block;">
              <rect width="200" height="150" fill="#282A2C"/>
              <rect x="16" y="16" width="38" height="118" rx="5" fill="#1C1D1F"/>
              <rect x="60" y="16" width="60" height="118" rx="5" fill="#1C1D1F"/>
              <rect x="126" y="16" width="58" height="118" rx="5" fill="#1C1D1F"/>
              <rect x="66" y="24" width="48" height="20" rx="4" fill="#77AECF" opacity=".55"/>
              <rect x="66" y="50" width="48" height="20" rx="4" fill="#63676B" opacity=".45"/>
            </svg>
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <div style="font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">보드-레이아웃-스케치.png</div>
            <div style="font-size: 11.5px; color: #63676B;">이윤건 · 8월 14일 · 210 KiB</div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
