<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
  <style>
    body { margin: 0; }
    a { color: #77AECF; text-decoration: none; }
    a:hover { color: #5197C2; text-decoration: underline; }
    ::selection { background: rgba(119,174,207,.28); }
  </style>
</helmet>

<div style="width: 1280px; height: 800px; display: flex; background: #121314; color: #DDE6ED; font-family: 'Pretendard', 'Noto Sans KR', system-ui, sans-serif; font-size: 14px; line-height: 1.5; -webkit-font-smoothing: antialiased;">

  <!-- 레일 -->
  <div style="width: 68px; flex: none; background: #0D0E0F; display: flex; flex-direction: column; align-items: center; padding: 14px 0; gap: 8px;">
    <div style="position: relative; display: flex; align-items: center;">
      <div style="position: absolute; left: -14px; top: 7px; bottom: 7px; width: 3px; background: #DDE6ED; border-radius: 0 3px 3px 0;"></div>
      <div style="width: 40px; height: 40px; border-radius: 11px; background: #77AECF; color: #121314; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 16px;">N</div>
    </div>
    <div style="width: 40px; height: 40px; border-radius: 11px; background: #1C1D1F; color: #9DA0A4; display: flex; align-items: center; justify-content: center; font-weight: 600; font-size: 15px;">L</div>
    <div style="flex: 1;"></div>
    <div style="position: relative;">
      <div style="width: 34px; height: 34px; border-radius: 9999px; background: #90A8C1; color: #121314; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 600;">이윤</div>
      <div style="position: absolute; right: -1px; bottom: -1px; width: 11px; height: 11px; border-radius: 9999px; background: #74B48F; border: 2.5px solid #0D0E0F;"></div>
    </div>
  </div>

  <!-- 두 번째 판 -->
  <div style="width: 244px; flex: none; background: #1C1D1F; display: flex; flex-direction: column; overflow: hidden;">
    <div style="height: 56px; flex: none; display: flex; align-items: center; padding: 0 16px; gap: 8px;">
      <span style="font-size: 15.5px; font-weight: 700; letter-spacing: -.015em;">Nexus</span>
      <svg width="11" height="11" viewBox="0 0 12 12" fill="currentColor" style="color: #63676B;"><path d="M2.5 4.5h7L6 9 2.5 4.5z"/></svg>
    </div>
    <div style="flex: 1; padding: 2px 8px; display: flex; flex-direction: column; gap: 16px;">
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <div style="padding: 0 8px 7px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: #63676B;">개발</div>
        <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 9px; border-radius: 8px;">
          <span style="color: #63676B; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1;">#</span>
          <span style="font-size: 13.5px; color: #9DA0A4;">개발</span>
        </div>
        <div style="display: flex; align-items: center; gap: 8px; height: 32px; padding: 0 9px; border-radius: 8px;">
          <span style="color: #63676B; font-family: 'JetBrains Mono', monospace; font-size: 14px; line-height: 1;">#</span>
          <span style="font-size: 13.5px; color: #DDE6ED; font-weight: 600;">nexus</span>
          <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; background: #77AECF; color: #121314; font-weight: 700; border-radius: 9999px; min-width: 18px; height: 18px; display: flex; align-items: center; justify-content: center; padding: 0 5px;">3</span>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 1px;">
        <div style="padding: 0 8px 7px; font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: #63676B;">작업</div>
        <div style="display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 9px; border-radius: 8px;">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#63676B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><rect x="2" y="2.5" width="4" height="11" rx="1"/><rect x="7.5" y="2.5" width="4" height="7" rx="1"/></svg>
          <span style="font-size: 13.5px; color: #9DA0A4;">이슈 보드</span>
          <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 10.5px; color: #63676B;">12</span>
        </div>
        <div style="position: relative; display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 9px; border-radius: 8px; background: rgba(119,174,207,.13);">
          <div style="position: absolute; left: 0; top: 6px; bottom: 6px; width: 2.5px; background: #77AECF; border-radius: 0 2px 2px 0;"></div>
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#77AECF" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M2 13V3M2 13h12M4.5 10.5l3-3 2.5 2 4-4.5"/></svg>
          <span style="font-size: 13.5px; color: #DDE6ED; font-weight: 600;">스프린트</span>
          <span style="margin-left: auto; font-size: 10px; font-weight: 700; letter-spacing: .05em; color: #74B48F; background: rgba(116,180,143,.14); border-radius: 4px; padding: 2px 5px;">진행</span>
        </div>
        <div style="display: flex; align-items: center; gap: 9px; height: 32px; padding: 0 9px; border-radius: 8px;">
          <svg width="15" height="15" viewBox="0 0 16 16" fill="none" stroke="#63676B" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" style="flex: none;"><path d="M2.5 4.5A1.5 1.5 0 014 3h2.5L8 4.5h4A1.5 1.5 0 0113.5 6v6A1.5 1.5 0 0112 13.5H4A1.5 1.5 0 012.5 12V4.5z"/></svg>
          <span style="font-size: 13.5px; color: #9DA0A4;">파일</span>
        </div>
      </div>
    </div>
  </div>

  <!-- 본문 -->
  <div style="flex: 1; min-width: 0; display: flex; flex-direction: column; background: #121314;">

    <div style="height: 56px; flex: none; display: flex; align-items: center; gap: 11px; padding: 0 20px; border-bottom: 1px solid rgba(221,230,237,.10);">
      <span style="font-size: 15.5px; font-weight: 700; letter-spacing: -.01em;">스프린트</span>
      <div style="margin-left: auto; display: flex; align-items: center; gap: 8px;">
        <div style="display: flex; padding: 2px; border-radius: 9px; background: #1C1D1F;">
          <div style="height: 26px; padding: 0 13px; border-radius: 7px; background: #282A2C; display: flex; align-items: center; font-size: 12.5px; font-weight: 600;">포인트</div>
          <div style="height: 26px; padding: 0 13px; border-radius: 7px; display: flex; align-items: center; font-size: 12.5px; color: #9DA0A4;">개수</div>
        </div>
        <div style="display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 13px; border-radius: 8px; background: #77AECF; color: #121314;">
          <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M8 3.5v9M3.5 8h9"/></svg>
          <span style="font-size: 12.5px; font-weight: 600;">새 스프린트</span>
        </div>
      </div>
    </div>

    <div style="flex: 1; min-height: 0; padding: 22px 24px; display: flex; flex-direction: column; gap: 22px; overflow: hidden;">

      <!-- 진행 중 스프린트 -->
      <div style="display: flex; flex-direction: column; gap: 16px;">
        <div style="display: flex; align-items: baseline; gap: 12px;">
          <span style="width: 8px; height: 8px; border-radius: 9999px; background: #74B48F; align-self: center;"></span>
          <span style="font-size: 17px; font-weight: 700; letter-spacing: -.015em;">스프린트 3</span>
          <span style="font-size: 13px; color: #9DA0A4;">8월 18일 – 8월 29일</span>
          <span style="font-size: 12.5px; color: #63676B;">남은 5일</span>
        </div>

        <div style="display: flex; gap: 16px;">
          <!-- 번다운 -->
          <div style="flex: 1; min-width: 0; background: #1C1D1F; border-radius: 10px; padding: 18px 20px 14px;">
            <div style="display: flex; align-items: center; gap: 16px; margin-bottom: 14px;">
              <span style="font-size: 13px; font-weight: 600;">번다운</span>
              <div style="display: flex; align-items: center; gap: 7px;">
                <span style="width: 14px; height: 2px; background: #63676B; border-radius: 2px;"></span>
                <span style="font-size: 11.5px; color: #9DA0A4;">이상선</span>
              </div>
              <div style="display: flex; align-items: center; gap: 7px;">
                <span style="width: 14px; height: 2.5px; background: #77AECF; border-radius: 2px;"></span>
                <span style="font-size: 11.5px; color: #9DA0A4;">실제</span>
              </div>
              <span style="margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 11.5px; color: #63676B;">단위: 포인트</span>
            </div>

            <svg viewBox="0 0 640 210" style="width: 100%; height: auto; display: block; overflow: visible;">
              <!-- 눈금 -->
              <line x1="44" y1="16" x2="620" y2="16" stroke="rgba(221,230,237,.07)" stroke-width="1"/>
              <line x1="44" y1="57" x2="620" y2="57" stroke="rgba(221,230,237,.07)" stroke-width="1"/>
              <line x1="44" y1="98" x2="620" y2="98" stroke="rgba(221,230,237,.07)" stroke-width="1"/>
              <line x1="44" y1="139" x2="620" y2="139" stroke="rgba(221,230,237,.07)" stroke-width="1"/>
              <line x1="44" y1="180" x2="620" y2="180" stroke="rgba(221,230,237,.16)" stroke-width="1"/>

              <text x="34" y="20" text-anchor="end" fill="#63676B" font-family="JetBrains Mono, monospace" font-size="10">21</text>
              <text x="34" y="61" text-anchor="end" fill="#63676B" font-family="JetBrains Mono, monospace" font-size="10">16</text>
              <text x="34" y="102" text-anchor="end" fill="#63676B" font-family="JetBrains Mono, monospace" font-size="10">11</text>
              <text x="34" y="143" text-anchor="end" fill="#63676B" font-family="JetBrains Mono, monospace" font-size="10">5</text>
              <text x="34" y="184" text-anchor="end" fill="#63676B" font-family="JetBrains Mono, monospace" font-size="10">0</text>

              <!-- 이상선 -->
              <line x1="44" y1="16" x2="620" y2="180" stroke="#63676B" stroke-width="1.5" stroke-dasharray="5 5"/>

              <!-- 오늘 -->
              <line x1="492" y1="8" x2="492" y2="180" stroke="rgba(221,230,237,.20)" stroke-width="1"/>
              <text x="492" y="200" text-anchor="middle" fill="#9DA0A4" font-family="JetBrains Mono, monospace" font-size="10">오늘</text>

              <!-- 실제 -->
              <polyline points="44,16 108,16 172,39 236,39 300,79 364,79 428,79 492,118"
                        fill="none" stroke="#77AECF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
              <circle cx="492" cy="118" r="4.5" fill="#77AECF"/>
              <circle cx="492" cy="118" r="8" fill="#77AECF" opacity=".18"/>

              <text x="44" y="200" text-anchor="middle" fill="#63676B" font-family="JetBrains Mono, monospace" font-size="10">8/18</text>
              <text x="236" y="200" text-anchor="middle" fill="#63676B" font-family="JetBrains Mono, monospace" font-size="10">8/21</text>
              <text x="620" y="200" text-anchor="middle" fill="#63676B" font-family="JetBrains Mono, monospace" font-size="10">8/29</text>
            </svg>
          </div>

          <!-- 요약 -->
          <div style="width: 232px; flex: none; display: flex; flex-direction: column; gap: 10px;">
            <div style="background: #1C1D1F; border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 4px;">
              <div style="font-size: 11px; font-weight: 600; letter-spacing: .07em; text-transform: uppercase; color: #63676B;">남은 포인트</div>
              <div style="display: flex; align-items: baseline; gap: 7px;">
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 30px; font-weight: 600; letter-spacing: -.02em;">8</span>
                <span style="font-size: 13px; color: #9DA0A4;">/ 21</span>
              </div>
              <div style="margin-top: 6px; height: 5px; border-radius: 9999px; background: #282A2C; overflow: hidden;">
                <div style="width: 62%; height: 100%; background: #77AECF; border-radius: 9999px;"></div>
              </div>
              <div style="font-size: 11.5px; color: #63676B; margin-top: 5px;">13pt 완료 · 62%</div>
            </div>

            <div style="background: #1C1D1F; border-radius: 10px; padding: 16px 18px; display: flex; flex-direction: column; gap: 10px;">
              <div style="display: flex; align-items: baseline; justify-content: space-between;">
                <span style="font-size: 12.5px; color: #9DA0A4;">이슈</span>
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 13.5px; font-weight: 600;">8</span>
              </div>
              <div style="display: flex; align-items: baseline; justify-content: space-between;">
                <span style="font-size: 12.5px; color: #9DA0A4;">완료</span>
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 13.5px; font-weight: 600; color: #74B48F;">5</span>
              </div>
              <div style="display: flex; align-items: baseline; justify-content: space-between;">
                <span style="font-size: 12.5px; color: #9DA0A4;">진행 · 리뷰</span>
                <span style="font-family: 'JetBrains Mono', monospace; font-size: 13.5px; font-weight: 600;">3</span>
              </div>
            </div>

            <div style="display: flex; align-items: center; justify-content: center; gap: 8px; height: 36px; border-radius: 8px; box-shadow: inset 0 0 0 1px rgba(221,230,237,.14); color: #9DA0A4;">
              <svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 5"/></svg>
              <span style="font-size: 13px; font-weight: 500;">스프린트 닫기</span>
            </div>
          </div>
        </div>
      </div>

      <div style="height: 1px; background: rgba(221,230,237,.10);"></div>

      <!-- 그 밖의 스프린트 -->
      <div style="display: flex; flex-direction: column; gap: 8px;">
        <div style="font-size: 12.5px; font-weight: 600; color: #9DA0A4; padding-bottom: 2px;">그 밖</div>

        <div style="display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 16px; border-radius: 8px; background: #1C1D1F;">
          <span style="width: 7px; height: 7px; border-radius: 9999px; background: #63676B;"></span>
          <span style="font-size: 14px; font-weight: 500;">스프린트 4</span>
          <span style="font-size: 12.5px; color: #63676B;">9월 1일 – 9월 12일</span>
          <span style="margin-left: auto; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; color: #9DA0A4; background: #282A2C; border-radius: 4px; padding: 3px 7px;">계획</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #63676B;">0 / 0pt</span>
        </div>

        <div style="display: flex; align-items: center; gap: 12px; height: 46px; padding: 0 16px; border-radius: 8px; background: #1C1D1F; opacity: .62;">
          <svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="#74B48F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 8.5l3.5 3.5L13 5"/></svg>
          <span style="font-size: 14px; font-weight: 500;">스프린트 2</span>
          <span style="font-size: 12.5px; color: #63676B;">8월 4일 – 8월 15일</span>
          <span style="margin-left: auto; font-size: 10.5px; font-weight: 700; letter-spacing: .05em; color: #9DA0A4; background: #282A2C; border-radius: 4px; padding: 3px 7px;">닫힘</span>
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 12px; color: #63676B;">18 / 24pt</span>
        </div>
      </div>
    </div>
  </div>
</div>
</x-dc>

<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }
}
</script>
</body>
</html>
