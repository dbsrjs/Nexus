<script type="text/babel" data-presets="react">
const { Fragment } = React;

// Parse a CSS declaration string into a React style object so the design's
// inline style strings can be used verbatim (max fidelity, min transcription error).
function css(s) {
  const o = {};
  if (s == null) return o;
  String(s).split(';').forEach((decl) => {
    const i = decl.indexOf(':');
    if (i < 0) return;
    const prop = decl.slice(0, i).trim();
    if (!prop) return;
    const val = decl.slice(i + 1).trim();
    o[prop.startsWith('--') ? prop : prop.replace(/-([a-z])/g, (_, c) => c.toUpperCase())] = val;
  });
  return o;
}

class App extends React.Component {
  state = {
    // ---- auth / bootstrap ----
    authed: false,
    booting: true,
    currentUser: null,
    loginEmail: '',
    loginPassword: '',
    loginError: '',
    loggingIn: false,

    // ---- UI state (unchanged) ----
    view: 'home',
    platform: 'desktop',
    mobileView: 'home',
    channelId: null,
    checkedIn: false,
    checkInTime: '09:01',
    draft: '',
    editingId: null,
    editDraft: '',
    logDraft: '',
    showNotif: false,
    selectedKey: null,
    showRoleMenu: false,
    aiRepo: null,
    aiDraft: '',
    aiThinking: false,
    aiMsgs: {},

    // ---- live data (from API) ----
    rawChannels: [],     // [{id,key,name,kind,initial,color,isReadonlyDefault,members}]
    usersById: {},       // id -> user
    rawIssues: { backlog: [], doing: [], review: [], done: [] },
    rawWorklogs: [],
    rawAttendance: [],
    rawNotices: [],
    rawNotifications: [],
    unread: 0,
    rawRepos: [],
    rawPerms: [],        // admin only
    selDetail: null,     // issue detail (with comments) for the open drawer
    commentDraft: '',    // issue drawer comment input
    commentSubmitting: false,
    msgs: {},            // channelId -> mapped message array
    msgsLoading: {},     // channelId -> bool
    filesByChannel: {},  // channelId -> File[] (raw API rows) for 파일 보관함
    imageUrls: {},       // fileId -> object URL (blob) for inline image preview
    uploading: false,    // file upload in-progress flag

    // ---- issue create form (Feature 2) ----
    showIssueForm: false,
    issueForm: { title: '', label: '기능', priority: 'mid', assigneeId: '', status: 'backlog' },
    creatingIssue: false,

    // ---- local-only frontend state ----
    tasks: [
      { id: 't1', text: 'v2.3 릴리스 노트 검토', tag: '개발', done: true, time: '10:00' },
      { id: 't2', text: '고객사 A 온보딩 미팅', tag: '운영', done: false, time: '13:30' },
      { id: 't3', text: '결제 모듈 QA 피드백 정리', tag: '개발', done: false, time: '15:00' },
      { id: 't4', text: '주간 업무일지 작성', tag: '공통', done: false, time: '18:00' },
    ],
  };

  // ===================== AUTH / BOOTSTRAP =====================
  componentDidMount() {
    if (window.API && API.isAuthed()) {
      this.setState({ authed: true, booting: true }, () => this.bootstrap());
    } else {
      this.setState({ booting: false });
    }
  }

  async doLogin(e) {
    if (e && e.preventDefault) e.preventDefault();
    const email = (this.state.loginEmail || '').trim();
    const password = this.state.loginPassword || '';
    if (!email || !password) { this.setState({ loginError: '이메일과 비밀번호를 입력해주세요.' }); return; }
    this.setState({ loggingIn: true, loginError: '' });
    try {
      const user = await API.login(email, password);
      this.setState({ authed: true, currentUser: user, booting: true, loggingIn: false, loginPassword: '' }, () => this.bootstrap());
    } catch (err) {
      this.setState({ loggingIn: false, loginError: (err && err.message) || '로그인에 실패했습니다.' });
    }
  }

  logout() {
    try { if (this._socket) this._socket.disconnect(); } catch (e) {}
    API.logout();
    window.location.reload();
  }

  async bootstrap() {
    try {
      const [me, channels, issues, worklogs, attendance, notices, notifications, unread, repos, users] = await Promise.all([
        API.me().catch(() => API.getUser()),
        API.channels().catch(() => []),
        API.issues().catch(() => ({ backlog: [], doing: [], review: [], done: [] })),
        API.worklogs().catch(() => []),
        API.attendance().catch(() => []),
        API.notices().catch(() => []),
        API.notifications().catch(() => ({ items: [], nextCursor: null })),
        API.unreadCount().catch(() => ({ count: 0 })),
        API.gitlabRepos().catch(() => []),
        API.users().catch(() => []),
      ]);

      const usersById = {};
      (users || []).forEach(u => { usersById[u.id] = u; });
      if (me && me.id && !usersById[me.id]) usersById[me.id] = me;

      // derive check-in card from today's attendance row
      const todayStr = new Date().toISOString().slice(0, 10);
      const todayAtt = (attendance || []).find(a => (a.date || '').slice(0, 10) === todayStr);
      const checkedIn = !!(todayAtt && todayAtt.checkInAt && !todayAtt.checkOutAt);

      // pick a default channel: first 'channel' kind
      const firstChannel = (channels || []).find(c => c.kind === 'channel') || (channels || [])[0];
      const firstRepo = (repos || [])[0];

      this.setState({
        currentUser: me || this.state.currentUser,
        rawChannels: channels || [],
        usersById,
        rawIssues: issues || { backlog: [], doing: [], review: [], done: [] },
        rawWorklogs: worklogs || [],
        rawAttendance: attendance || [],
        rawNotices: notices || [],
        rawNotifications: (notifications && notifications.items) || [],
        unread: (unread && unread.count) || 0,
        rawRepos: repos || [],
        channelId: this.state.channelId || (firstChannel ? firstChannel.id : null),
        aiRepo: this.state.aiRepo || (firstRepo ? firstRepo.id : null),
        checkedIn,
        checkInTime: todayAtt && todayAtt.checkInAt ? this.fmtTime(todayAtt.checkInAt) : this.state.checkInTime,
        booting: false,
      }, () => {
        if (this.state.channelId) { this.loadMessages(this.state.channelId); this.loadChannelFiles(this.state.channelId); }
        if (me && me.role === 'admin') this.loadPerms();
        this.connectSocket();
      });
    } catch (err) {
      console.error('[bootstrap]', err);
      this.setState({ booting: false });
    }
  }

  async loadPerms() {
    try { const perms = await API.permissions(); this.setState({ rawPerms: perms || [] }); }
    catch (e) { /* non-admin / 403 — ignore */ }
  }

  // ===================== SOCKET =====================
  // The Socket.IO handshake authenticates with the access token read at creation
  // time. That token can be EXPIRED in localStorage (REST calls auto-refresh on a
  // 401, but the socket has no such retry), so the gateway verifies it, fails, and
  // server-disconnects immediately ("io server disconnect"). We therefore refresh
  // the token via an authed REST call (API.me triggers api.js's transparent refresh)
  // BEFORE creating the socket, and re-refresh+reconnect if the server drops us.
  async connectSocket() {
    if (this._socketInit) return; // guard double boot-invoke
    this._socketInit = true;
    await this._freshConnect();
  }
  async _freshConnect() {
    try { await API.me(); } catch (e) { /* refresh attempted; proceed regardless */ }
    if (this._socket) { try { this._socket.removeAllListeners(); this._socket.disconnect(); } catch (e) {} this._socket = null; }
    try {
      const sock = API.connectSocket((event, payload) => this.onSocket(event, payload));
      this._socket = sock;
      if (sock && typeof sock.on === 'function') {
        sock.on('connect', () => { this._socketRetries = 0; });
        sock.on('disconnect', (reason) => {
          // Server-initiated drop ⇒ likely a stale token; refresh + recreate. Bounded.
          if (reason === 'io server disconnect' && (this._socketRetries || 0) < 4) {
            this._socketRetries = (this._socketRetries || 0) + 1;
            setTimeout(() => this._freshConnect(), 600);
          }
        });
        try { if (sock.io) sock.io.skipReconnect = false; if (!sock.connected) sock.connect(); } catch (e) {}
      }
    } catch (e) { console.warn('[socket]', e); }
  }
  onSocket(event, payload) {
    if (!payload) return;
    const cid = payload.channelId;
    if ((event === 'message:new' || event === 'message:edited') && cid) {
      // only update if we already have that channel loaded (or it's the open one)
      const open = this.state.channelId === cid && this.state.view === 'chat';
      if (!this.state.msgs[cid] && !open) return;
      const mapped = this.mapMessage(payload);
      const cur = (this.state.msgs[cid] || []).slice();
      const idx = cur.findIndex(m => m.id === mapped.id);
      if (event === 'message:edited' || idx >= 0) {
        if (idx >= 0) cur[idx] = mapped; else cur.push(mapped);
      } else {
        cur.push(mapped);
      }
      this.setState({ msgs: { ...this.state.msgs, [cid]: cur } }, () => { if (open) this.scrollBottom(); this.ensureImageUrls(cid); });
    } else if (event === 'notification:new') {
      // Backend emits the FULL notification row {id,type,read,createdAt,payload:{...}}.
      // Be defensive: if only a bare payload object arrives, wrap it.
      const notif = (payload && payload.payload) ? payload
        : { id: 'rt-' + Date.now(), type: 'message', read: false, createdAt: new Date().toISOString(), payload: payload };
      const merged = { ...notif, read: false };
      const exists = this.state.rawNotifications.some(n => n.id === merged.id);
      if (exists) return;
      this.setState({ unread: this.state.unread + 1, rawNotifications: [merged, ...this.state.rawNotifications].slice(0, 30) });
    }
  }

  // ===================== HELPERS / FORMATTERS =====================
  fmtTime(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    if (isNaN(d)) return '';
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }
  fmtDayDate(iso) {
    const d = new Date(iso);
    const wd = ['일','월','화','수','목','금','토'][d.getDay()];
    return { day: wd, date: (d.getMonth() + 1) + '/' + d.getDate(), full: (d.getMonth() + 1) + '/' + d.getDate() + ' (' + wd + ')' };
  }
  relTime(iso) {
    if (!iso) return '';
    const d = new Date(iso); if (isNaN(d)) return '';
    const diff = Date.now() - d.getTime();
    const min = Math.floor(diff / 60000);
    if (min < 1) return '방금';
    if (min < 60) return min + '분 전';
    const hr = Math.floor(min / 60);
    if (hr < 24) return hr + '시간 전';
    const day = Math.floor(hr / 24);
    if (day === 1) return '어제';
    if (day < 7) return day + '일 전';
    return (d.getMonth() + 1) + '/' + d.getDate();
  }
  userById(id) { return this.state.usersById[id] || null; }

  mapMessage(m) {
    const author = m.author || this.userById(m.authorId) || {};
    const rawFiles = m.files || [];
    const isImg = (f) => /^(png|jpg|jpeg|gif|webp|bmp|svg)$/i.test(f.ext || ((f.name || '').split('.').pop() || ''));
    const images = rawFiles.filter(isImg).map(f => ({ id: f.id, name: f.name }));
    const docs = rawFiles.filter(f => !isImg(f)).map(f => ({ id: f.id, name: f.name, ext: (f.ext || (f.name || '').split('.').pop() || '').toUpperCase().slice(0, 4) }));
    // Hide the "[이미지]/[파일] name" marker text when a real attachment is present.
    const rawBody = m.body || '';
    const text = (rawFiles.length > 0 && /^\[(이미지|파일)\]\s/.test(rawBody)) ? '' : rawBody;
    return {
      id: m.id,
      authorId: m.authorId,
      author: author.name || '알 수 없음',
      initial: author.initial || (author.name ? author.name[0] : '?'),
      color: author.color || '#A2AAB2',
      time: this.fmtTime(m.createdAt),
      text,
      editedAt: m.editedAt ? this.fmtTime(m.editedAt) : null,
      images,
      docs,
    };
  }

  // ===================== DATA LOADERS =====================
  async loadMessages(channelId) {
    if (!channelId) return;
    this.setState({ msgsLoading: { ...this.state.msgsLoading, [channelId]: true } });
    try {
      const res = await API.messages(channelId);
      const items = (res && res.items) || [];
      // API is NEWEST-FIRST → reverse to oldest-first
      const mapped = items.slice().reverse().map(m => this.mapMessage(m));
      this.setState({ msgs: { ...this.state.msgs, [channelId]: mapped }, msgsLoading: { ...this.state.msgsLoading, [channelId]: false } },
        () => { if (this.state.channelId === channelId) this.scrollBottom(); this.ensureImageUrls(channelId); });
    } catch (err) {
      this.setState({ msgs: { ...this.state.msgs, [channelId]: [] }, msgsLoading: { ...this.state.msgsLoading, [channelId]: false } });
    }
  }
  async refetchWorklogs() { try { const w = await API.worklogs(); this.setState({ rawWorklogs: w || [] }); } catch (e) {} }
  async refetchAttendance() {
    try {
      const a = await API.attendance(); const todayStr = new Date().toISOString().slice(0, 10);
      const todayAtt = (a || []).find(r => (r.date || '').slice(0, 10) === todayStr);
      this.setState({ rawAttendance: a || [], checkedIn: !!(todayAtt && todayAtt.checkInAt && !todayAtt.checkOutAt), checkInTime: todayAtt && todayAtt.checkInAt ? this.fmtTime(todayAtt.checkInAt) : this.state.checkInTime });
    } catch (e) {}
  }

  componentDidUpdate(prevProps, prevState) {
    if (!prevState) return;
    if (prevState.channelId !== this.state.channelId || prevState.msgs !== this.state.msgs) this.scrollBottom();
    if (prevState.aiMsgs !== this.state.aiMsgs || prevState.aiThinking !== this.state.aiThinking || prevState.aiRepo !== this.state.aiRepo) this.scrollAiBottom();
  }
  scrollBottom() {
    const el = this._scrollEl;
    if (el) requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; });
  }

  nowHHMM() {
    const d = new Date();
    return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
  }

  navStyleFor(id) {
    const a = this.state.view === id;
    return 'display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:none;border-radius:9px;cursor:pointer;font-size:14px;text-align:left;transition:background .12s;'
      + (a ? 'background:#EAF1FF;color:#2563EB;font-weight:600;' : 'background:transparent;color:#3D454D;font-weight:500;');
  }
  channelStyleFor(id) {
    const a = this.state.view === 'chat' && this.state.channelId === id;
    return 'display:flex;align-items:center;gap:9px;width:100%;padding:7px 10px;border:none;border-radius:8px;cursor:pointer;font-size:13.5px;text-align:left;'
      + (a ? 'background:#EAF1FF;color:#15181B;font-weight:600;' : 'background:transparent;color:#3D454D;font-weight:500;');
  }
  mTabStyleFor(id) {
    const a = this.state.mobileView === id;
    return 'flex:1;border:none;background:transparent;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding-top:8px;color:' + (a ? '#2563EB' : '#A2AAB2') + ';';
  }

  // Server enforces channel-list visibility; the list is already filtered.
  // canView is only used as a fallback when switching channels client-side.
  canView(id) { return !!this.state.rawChannels.find(c => c.id === id); }
  // For the composer: optimistically allow sending; a 403 surfaces the read-only notice.
  canSend(id) {
    const c = this.state.rawChannels.find(ch => ch.id === id);
    if (!c) return false;
    return !c.isReadonlyDefault || (this.state.readonlyDenied || {})[id] !== true;
  }

  async togglePerm(channelId, role, kind) {
    const perms = JSON.parse(JSON.stringify(this.state.rawPerms));
    const row = perms.find(p => p.channelId === channelId); if (!row) return;
    const cell = row.roles.find(r => r.role === role); if (!cell) return;
    if (kind === 'view') { cell.canView = !cell.canView; if (!cell.canView) cell.canSend = false; }
    else { cell.canSend = !cell.canSend; if (cell.canSend) cell.canView = true; }
    this.setState({ rawPerms: perms }); // optimistic
    try {
      await API.setPermission(channelId, role, { canView: cell.canView, canSend: cell.canSend });
      this.loadPerms();
    } catch (e) { this.loadPerms(); }
  }
  startEdit(id, text) { this.setState({ editingId: id, editDraft: text }); }
  cancelEdit() { this.setState({ editingId: null, editDraft: '' }); }
  async saveEdit() {
    const id = this.state.editingId; if (!id) return;
    const text = (this.state.editDraft || '').trim(); if (!text) return;
    const cid = this.state.channelId;
    // optimistic
    const arr = (this.state.msgs[cid] || []).map(m => (m.id === id && m.text !== text) ? { ...m, text, editedAt: this.nowHHMM() } : m);
    this.setState({ msgs: { ...this.state.msgs, [cid]: arr }, editingId: null, editDraft: '' });
    try { await API.editMessage(id, text); this.loadMessages(cid); }
    catch (e) { this.loadMessages(cid); }
  }

  // GitLab repos come from the API (currently empty — no token configured).
  repoMeta() {
    return (this.state.rawRepos || []).map(r => ({
      id: r.id, name: r.name, path: r.path || r.fullPath || r.namespace || '',
      branch: r.branch || r.defaultBranch || 'main',
      commit: r.lastCommit || r.commit || '', sync: r.syncedAt ? this.relTime(r.syncedAt) : '미동기화',
      kind: r.kind || 'app',
    }));
  }
  async aiSend(forceText) {
    const q = ((typeof forceText === 'string' ? forceText : this.state.aiDraft) || '').trim();
    if (!q || this.state.aiThinking) return;
    const repo = this.state.aiRepo || '_';
    const arr = (this.state.aiMsgs[repo] || []).concat([{ type: 'user', text: q }]);
    this.setState({ aiMsgs: { ...this.state.aiMsgs, [repo]: arr }, aiDraft: '', aiThinking: true });
    let res;
    try {
      // aiAnalyze returns 501 (준비 중) — degrade gracefully to a "준비 중" bubble.
      const data = await API.aiAnalyze({ repoId: this.state.aiRepo, query: q });
      res = data && (data.summary || data.findings) ? data : { summary: 'AI 분석 결과를 받았어요.' };
    } catch (err) {
      res = { summary: 'AI 코드 분석은 아직 준비 중입니다. GitLab 연동과 분석 엔진이 연결되면 로그·코드 분석 결과를 여기에서 보여드릴게요.', findings: [], logs: [], verdict: null };
    }
    const arr2 = (this.state.aiMsgs[repo] || []).concat([{ type: 'ai', query: q, ...res }]);
    this.setState({ aiMsgs: { ...this.state.aiMsgs, [repo]: arr2 }, aiThinking: false });
  }
  aiEscalate(repoId, q) { /* no-op: 운영요청 이슈 자동 생성은 백엔드 미연동 */ }
  scrollAiBottom() { const el = this._aiScrollEl; if (el) requestAnimationFrame(() => { el.scrollTop = el.scrollHeight; }); }

  // Channels/DMs come straight from the (already permission-filtered) API list.
  // No member counts / unread badges are returned, so we omit them.
  channelMeta() {
    return this.state.rawChannels.filter(c => c.kind === 'channel')
      .map(c => ({ id: c.id, key: c.key, name: c.name, initial: c.initial, color: c.color, isReadonlyDefault: c.isReadonlyDefault }));
  }
  dmMeta() {
    return this.state.rawChannels.filter(c => c.kind === 'dm')
      .map(c => ({ id: c.id, key: c.key, name: c.name, initial: c.initial, color: c.color }));
  }

  openChannel(id) {
    this.setState({ view: 'chat', channelId: id, showNotif: false }, () => {
      if (!this.state.msgs[id]) this.loadMessages(id);
      this.loadChannelFiles(id);
    });
  }

  // ===================== NOTIFICATIONS (Feature 1) =====================
  async openNotificationTarget(n) {
    const id = n.id;
    const wasUnread = !n.read;
    // optimistic: mark read locally + decrement badge
    const list = this.state.rawNotifications.map(x => x.id === id ? { ...x, read: true } : x);
    this.setState({
      rawNotifications: list,
      unread: wasUnread ? Math.max(0, this.state.unread - 1) : this.state.unread,
      showNotif: false,
    });
    if (id && String(id).indexOf('rt-') !== 0) {
      try { await API.readNotification(id); } catch (e) { /* ignore — already optimistic */ }
    }
    const cid = n.payload && n.payload.channelId;
    if (cid && this.canView(cid)) this.openChannel(cid);
  }

  // ===================== FILES (Feature 3) =====================
  async loadChannelFiles(channelId) {
    if (!channelId) return;
    try {
      const rows = await API.channelFiles(channelId);
      this.setState({ filesByChannel: { ...this.state.filesByChannel, [channelId]: rows || [] } });
    } catch (e) {
      this.setState({ filesByChannel: { ...this.state.filesByChannel, [channelId]: [] } });
    }
  }
  triggerFilePick() { if (this._fileInput) this._fileInput.click(); }
  onFilePicked(e) {
    const file = e && e.target && e.target.files && e.target.files[0];
    if (e && e.target) e.target.value = ''; // allow re-picking same file
    this.uploadFileObj(file);
  }
  // Paste an image from the clipboard (e.g. a screenshot via Ctrl+V) into the chat composer.
  onPasteComposer(e) {
    const items = (e.clipboardData && e.clipboardData.items) || [];
    for (let i = 0; i < items.length; i++) {
      const it = items[i];
      if (it.kind === 'file' && it.type && it.type.indexOf('image/') === 0) {
        const blob = it.getAsFile();
        if (blob) {
          e.preventDefault();
          const ext = (it.type.split('/')[1] || 'png').replace('jpeg', 'jpg');
          const named = (blob.name && /\.[a-z0-9]+$/i.test(blob.name))
            ? blob
            : new File([blob], '스크린샷-' + this.nowHHMM().replace(':', '') + '.' + ext, { type: it.type });
          this.uploadFileObj(named);
        }
        return;
      }
    }
  }
  // Upload a file linked to a message (so it can render inline in the chat).
  uploadLinked(cid, file, messageId) {
    const fd = new FormData();
    fd.append('file', file);
    if (messageId) fd.append('messageId', messageId);
    return fetch(API.base + '/channels/' + cid + '/files', {
      method: 'POST',
      headers: { Authorization: 'Bearer ' + API.getToken() },
      body: fd,
    }).then(r => (r.ok ? r.json() : Promise.reject(Object.assign(new Error('HTTP ' + r.status), { status: r.status }))));
  }
  // Fetch (with JWT) and cache object URLs for any image attachments not yet loaded.
  async ensureImageUrls(channelId) {
    this._imgLoading = this._imgLoading || {};
    const msgs = this.state.msgs[channelId] || [];
    const todo = [];
    msgs.forEach(m => (m.images || []).forEach(im => {
      if (im.id && !this.state.imageUrls[im.id] && !this._imgLoading[im.id]) todo.push(im);
    }));
    for (const im of todo) {
      this._imgLoading[im.id] = true;
      try {
        const res = await fetch(API.fileUrl(im.id), { headers: { Authorization: 'Bearer ' + API.getToken() }, cache: 'no-store' });
        if (res.ok) {
          const url = URL.createObjectURL(await res.blob());
          this.setState({ imageUrls: { ...this.state.imageUrls, [im.id]: url } });
        }
      } catch (e) { /* leave as loading placeholder */ }
    }
  }
  // Shared upload path for both the file picker and clipboard paste.
  async uploadFileObj(file) {
    const cid = this.state.channelId;
    if (!file || !cid) return;
    const isImage = !!(file.type && file.type.indexOf('image/') === 0);
    this.setState({ uploading: true });
    try {
      // Create the message first, then attach the file to it so it renders inline.
      const created = await API.sendMessage(cid, (isImage ? '[이미지] ' : '[파일] ') + (file.name || '첨부'));
      let fileRow = null;
      try { fileRow = await this.uploadLinked(cid, file, created.id); } catch (e2) { /* keep the text message if link fails */ }
      await this.loadChannelFiles(cid);
      const mapped = this.mapMessage({ ...created, files: fileRow ? [fileRow] : [] });
      const cur = (this.state.msgs[cid] || []).slice();
      const idx = cur.findIndex(m => m.id === mapped.id);
      if (idx >= 0) cur[idx] = mapped; else cur.push(mapped);
      this.setState({ msgs: { ...this.state.msgs, [cid]: cur }, uploading: false }, () => { this.scrollBottom(); this.ensureImageUrls(cid); });
    } catch (err) {
      this.setState({ uploading: false, uploadError: (err && err.status === 403) ? '이 채널에 업로드할 권한이 없습니다.' : '파일 업로드에 실패했습니다.' });
      setTimeout(() => this.setState({ uploadError: '' }), 4000);
    }
  }
  fmtSize(bytes) {
    const n = Number(bytes) || 0;
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(1) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }
  // Download a file through the authenticated API. The endpoint needs the JWT, so a
  // plain <a href> would 401 — fetch as a blob (with the bearer token) then save it.
  async downloadFile(id, name) {
    if (!id) return;
    const doFetch = () => fetch(API.fileUrl(id), { headers: { Authorization: 'Bearer ' + API.getToken() }, cache: 'no-store' });
    try {
      let res = await doFetch();
      if (res.status === 401) { try { await API.me(); } catch (e) {} res = await doFetch(); }
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const blob = await res.blob();
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url; a.download = name || 'download';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(() => URL.revokeObjectURL(url), 2000);
    } catch (e) {
      this.setState({ uploadError: '파일을 내려받지 못했습니다.' });
      setTimeout(() => this.setState({ uploadError: '' }), 4000);
    }
  }

  // ===================== ISSUES (Feature 2) =====================
  openIssueForm() {
    const cu = this.state.currentUser || {};
    this.setState({ showIssueForm: true, issueForm: { title: '', label: '기능', priority: 'mid', assigneeId: cu.id || '', status: 'backlog' } });
  }
  closeIssueForm() { this.setState({ showIssueForm: false }); }
  setIssueField(k, v) { this.setState({ issueForm: { ...this.state.issueForm, [k]: v } }); }
  async submitIssueForm() {
    const f = this.state.issueForm;
    const title = (f.title || '').trim();
    if (!title || this.state.creatingIssue) return;
    this.setState({ creatingIssue: true });
    const data = { title, label: f.label, priority: f.priority, status: f.status || 'backlog' };
    if (f.assigneeId) data.assigneeId = f.assigneeId;
    try {
      await API.createIssue(data);
      await this.refetchIssues();
      this.setState({ creatingIssue: false, showIssueForm: false });
    } catch (e) {
      this.setState({ creatingIssue: false, issueFormError: (e && e.message) || '이슈 생성에 실패했습니다.' });
      setTimeout(() => this.setState({ issueFormError: '' }), 4000);
    }
  }
  async refetchIssues() {
    try { const issues = await API.issues(); this.setState({ rawIssues: issues || { backlog: [], doing: [], review: [], done: [] } }); }
    catch (e) {}
  }
  async changeIssueStatus(status) {
    const id = this.state.selectedKey;
    if (!id) return;
    try {
      await API.updateIssue(id, { status });
      await this.refetchIssues();
      try { const d = await API.issue(id); this.setState({ selDetail: d }); } catch (e2) {}
    } catch (e) { /* ignore */ }
  }
  async submitComment() {
    const id = (this.state.selDetail && this.state.selDetail.id) || this.state.selectedKey;
    const body = (this.state.commentDraft || '').trim();
    if (!id || !body || this.state.commentSubmitting) return;
    this.setState({ commentSubmitting: true });
    try {
      await API.addIssueComment(id, body);
      const d = await API.issue(id); // reload detail so the new comment renders
      this.setState({ selDetail: d, commentDraft: '', commentSubmitting: false });
    } catch (e) {
      this.setState({ commentSubmitting: false });
    }
  }

  async sendMessage() {
    const text = (this.state.draft || '').trim();
    if (!text) return;
    const cid = this.state.channelId; if (!cid) return;
    this.setState({ draft: '' });
    try {
      const created = await API.sendMessage(cid, text);
      // append (socket may also deliver it; mapMessage de-dups by id)
      const mapped = this.mapMessage(created);
      const cur = (this.state.msgs[cid] || []).slice();
      if (!cur.find(m => m.id === mapped.id)) cur.push(mapped);
      const rd = { ...(this.state.readonlyDenied || {}) }; delete rd[cid];
      this.setState({ msgs: { ...this.state.msgs, [cid]: cur }, readonlyDenied: rd }, () => this.scrollBottom());
    } catch (err) {
      if (err && err.status === 403) {
        // surface the existing read-only notice
        this.setState({ readonlyDenied: { ...(this.state.readonlyDenied || {}), [cid]: true } });
      } else {
        this.setState({ draft: text }); // restore on transient failure
      }
    }
  }

  toggleTask(id) {
    this.setState({ tasks: this.state.tasks.map(t => t.id === id ? { ...t, done: !t.done } : t) });
  }

  async saveLog() {
    const text = (this.state.logDraft || '').trim();
    if (!text) return;
    this.setState({ logDraft: '' });
    try { await API.createWorklog({ tag: '개발', body: text }); this.refetchWorklogs(); }
    catch (e) { this.setState({ logDraft: text }); }
  }

  async doCheck() {
    const wasIn = this.state.checkedIn;
    // optimistic update of the card
    this.setState({ checkedIn: !wasIn, checkInTime: wasIn ? this.state.checkInTime : this.nowHHMM() });
    try {
      if (wasIn) await API.checkOut(); else await API.checkIn();
      this.refetchAttendance();
    } catch (e) { this.refetchAttendance(); }
  }

  async openIssue(id, key) {
    this.setState({ selectedKey: id || key, selDetail: null });
    if (!id) return;
    try { const d = await API.issue(id); this.setState({ selDetail: d }); }
    catch (e) { /* show description-only */ }
  }

  allIssues() {
    const i = this.state.rawIssues;
    return [...(i.backlog || []), ...(i.doing || []), ...(i.review || []), ...(i.done || [])];
  }
  statusLabel(s) {
    return { backlog: '백로그', doing: '진행 중', review: '리뷰', done: '완료' }[s] || s;
  }

  // Map a raw API issue to the exact shape the existing card/drawer JSX expects.
  mapIssue(it) {
    const prMap = { low: { priority: '낮음', prColor: '#A2AAB2' }, mid: { priority: '중간', prColor: '#E08A00' }, high: { priority: '높음', prColor: '#E5484D' } };
    const labelMap = {
      '기능': { labelColor: '#2563EB', labelBg: '#EAF1FF' },
      '버그': { labelColor: '#E5484D', labelBg: '#FCEBEC' },
      '디자인': { labelColor: '#7C5CFC', labelBg: '#F0ECFE' },
      '개선': { labelColor: '#15A66A', labelBg: '#E6F6EF' },
      '운영': { labelColor: '#15A66A', labelBg: '#E6F6EF' },
    };
    const pr = prMap[it.priority] || { priority: it.priority || '중간', prColor: '#E08A00' };
    const lb = labelMap[it.label] || { labelColor: '#5B636B', labelBg: '#EEF1F4' };
    const u = this.userById(it.assigneeId) || {};
    return {
      id: it.id, key: it.key, title: it.title, status: it.status,
      description: it.description || '',
      assigneeId: it.assigneeId,
      assignee: u.name || '미지정',
      initial: u.initial || (u.name ? u.name[0] : '·'),
      color: u.color || '#A2AAB2',
      ...pr, label: it.label || '', ...lb,
    };
  }

  renderVals() {
    const s = this.state;
    const hour = new Date().getHours();
    const greeting = hour < 11 ? '좋은 아침이에요' : hour < 18 ? '안녕하세요' : '오늘도 고생하셨어요';

    const tasks = s.tasks.map(t => ({
      ...t,
      onToggle: () => this.toggleTask(t.id),
      boxStyle: 'width:20px;height:20px;flex:none;border-radius:6px;display:flex;align-items:center;justify-content:center;'
        + (t.done ? 'background:#2563EB;border:1px solid #2563EB;' : 'background:#fff;border:1.5px solid #CDD3DA;'),
      textStyle: 'flex:1;font-size:13.5px;font-weight:500;' + (t.done ? 'color:#A2AAB2;text-decoration:line-through;' : 'color:#2B3138;'),
      tagColor: t.tag === '개발' ? '#2563EB' : t.tag === '운영' ? '#15A66A' : '#5B636B',
      tagBg: t.tag === '개발' ? '#EAF1FF' : t.tag === '운영' ? '#E6F6EF' : '#EEF1F4',
    }));
    const tasksLeft = s.tasks.filter(t => !t.done).length;
    const doneCount = s.tasks.filter(t => t.done).length;

    const channels = this.channelMeta().map(c => ({ ...c, unread: 0, onClick: () => this.openChannel(c.id), style: this.channelStyleFor(c.id) }));
    const dms = this.dmMeta().map(d => ({ ...d, onClick: () => this.openChannel(d.id), style: this.channelStyleFor(d.id) }));

    const chMap = {};
    [...this.channelMeta(), ...this.dmMeta()].forEach(c => { chMap[c.id] = c; });
    const cc = chMap[s.channelId] || { name: '채팅', initial: '#', color: '#2563EB' };
    // Member count is not provided by the API — blank it out (do not invent a number).
    const currentChannel = { name: cc.name, initial: cc.initial, color: cc.color, members: '' };

    const rawMsgs = s.msgs[s.channelId] || [];
    const cu = s.currentUser || {};
    const messages = rawMsgs.map(m => {
      const mine = m.authorId && cu.id && m.authorId === cu.id;
      const editing = s.editingId === m.id;
      const images = (m.images || []).map(im => ({ ...im, url: s.imageUrls[im.id] || null, onDownload: () => this.downloadFile(im.id, im.name) }));
      const docs = (m.docs || []).map(d => ({ ...d, onDownload: () => this.downloadFile(d.id, d.name) }));
      return { ...m,
        canEdit: mine && !!m.text && !editing,
        isEditing: editing,
        showText: !editing && !!m.text,
        editedFlag: false, // list API does not return previous text — drop the "수정 전" block
        editedSuffix: m.editedAt ? '(수정됨 ' + m.editedAt + ')' : '',
        onEdit: () => this.startEdit(m.id, m.text),
        images, docs, hasImages: images.length > 0, hasDocs: docs.length > 0,
      };
    });

    // 파일 보관함: real File rows for the open channel (newest-first from API).
    const fileColors = { PDF: '#E5484D', DOC: '#2563EB', DOCX: '#2563EB', XLS: '#15A66A', XLSX: '#15A66A', PPT: '#E08A00', PPTX: '#E08A00', PNG: '#7C5CFC', JPG: '#7C5CFC', JPEG: '#7C5CFC', GIF: '#7C5CFC', ZIP: '#5B636B', TXT: '#5B636B' };
    const channelFiles = (s.filesByChannel[s.channelId] || []).map(f => {
      const ext = (f.ext || (f.name && f.name.indexOf('.') >= 0 ? f.name.split('.').pop() : '') || 'FILE').toUpperCase();
      return { id: f.id, name: f.name, size: this.fmtSize(f.sizeBytes), ext: ext.slice(0, 4), age: this.relTime(f.createdAt), color: fileColors[ext] || '#5B636B', onDownload: () => this.downloadFile(f.id, f.name) };
    });

    const cols = [
      { id: 'backlog', title: '백로그', accent: '#A2AAB2', items: (s.rawIssues.backlog || []).map(it => this.mapIssue(it)) },
      { id: 'doing', title: '진행 중', accent: '#2563EB', items: (s.rawIssues.doing || []).map(it => this.mapIssue(it)) },
      { id: 'review', title: '리뷰', accent: '#7C5CFC', items: (s.rawIssues.review || []).map(it => this.mapIssue(it)) },
      { id: 'done', title: '완료', accent: '#15A66A', items: (s.rawIssues.done || []).map(it => this.mapIssue(it)) },
    ];
    const columns = cols.map(col => ({
      title: col.title, accent: col.accent, count: col.items.length,
      items: col.items.map(it => ({ ...it, onClick: () => this.openIssue(it.id, it.key) })),
    }));

    const selRaw = this.allIssues().find(i => i.id === s.selectedKey || i.key === s.selectedKey);
    const detail = s.selDetail;
    const sel = selRaw ? (() => {
      const m = this.mapIssue(selRaw);
      const comments = (detail && detail.comments ? detail.comments : []).map(c => {
        const u = this.userById(c.authorId) || {};
        return { who: u.name || '알 수 없음', initial: u.initial || '?', color: u.color || '#A2AAB2', time: this.relTime(c.createdAt), text: c.body };
      });
      return { ...m, statusLabel: this.statusLabel(m.status), desc: (detail && detail.description) || m.description || '설명이 없습니다.', comments };
    })() : null;

    const allMapped = this.allIssues().map(it => this.mapIssue(it));
    const myIssues = allMapped.filter(i => i.assigneeId && cu.id && i.assigneeId === cu.id && (i.status === 'doing' || i.status === 'review')).slice(0, 2)
      .map(it => ({ ...it, onClick: () => this.setState({ view: 'dev' }, () => this.openIssue(it.id, it.key)) }));

    const notices = (s.rawNotices || []).map(n => ({
      id: n.id, title: n.title, team: n.team, pinned: !!n.pinned, time: this.relTime(n.createdAt),
    }));
    // No backend endpoint for the team activity feed — keep it as a small local feed.
    const activity = [];
    const notifColors = ['#2563EB', '#15A66A', '#E08A00', '#7C5CFC', '#E5484D', '#0EA5A8'];
    const notifs = (s.rawNotifications || []).map((n, i) => {
      const p = n.payload || {};
      const author = p.authorName || '알 수 없음';
      const channel = p.channelName || '채널';
      const initial = author && author !== '알 수 없음' ? author[0] : '알';
      return {
        id: n.id,
        read: !!n.read,
        initial,
        color: notifColors[(author.charCodeAt(0) || i) % notifColors.length],
        text: author + '님이 ' + channel + '에 메시지를 보냈습니다',
        preview: p.preview || '',
        time: this.relTime(n.createdAt),
        onClick: () => this.openNotificationTarget(n),
      };
    });
    const hasUnread = (s.unread || 0) > 0;

    const stEnum = { normal: '정상', late: '지각', working: '근무중', scheduled: '예정' };
    const stColor = { '정상': '#15A66A', '지각': '#E08A00', '근무중': '#2563EB', '예정': '#A2AAB2' };
    const stBg = { '정상': '#E6F6EF', '지각': '#FCF1DF', '근무중': '#EAF1FF', '예정': '#F1F3F6' };
    const attendance = (s.rawAttendance || []).slice().sort((a, b) => new Date(a.date) - new Date(b.date)).map(a => {
      const dd = this.fmtDayDate(a.date);
      const status = stEnum[a.status] || a.status;
      return {
        day: dd.day, date: dd.date,
        in: a.checkInAt ? this.fmtTime(a.checkInAt) : '—',
        out: a.checkOutAt ? this.fmtTime(a.checkOutAt) : '—',
        status,
        cardStyle: 'border:1px solid ' + (status === '근무중' ? '#C9D6F2' : '#EFF1F4') + ';border-radius:12px;padding:13px 14px;background:' + (status === '근무중' ? '#FBFCFF' : '#FBFCFD') + ';',
        statusColor: stColor[status], statusBg: stBg[status],
      };

    const worklogs = (s.rawWorklogs || []).map(w => ({
      date: this.fmtDayDate(w.date).full, tag: w.tag, text: w.body,

      tagBg: w.tag === '개발' ? '#EAF1FF' : '#E6F6EF',
    }));

    const mobileIssues = [...(s.rawIssues.doing || []), ...(s.rawIssues.review || []), ...(s.rawIssues.backlog || [])].map(it => { const m = this.mapIssue(it); return { ...m, statusLabel: this.statusLabel(m.status) }; });

    const roleOrder = ['admin', 'lead', 'member', 'guest'];
    const roleName = { admin: '관리자', lead: '팀장', member: '팀원', guest: '게스트' };
    const roleColor = { admin: '#E5484D', lead: '#2563EB', member: '#15A66A', guest: '#8A929B' };
    const roleDesc = { admin: '전체 채널 보기·쓰기 및 권한 관리', lead: '전사 공지 작성, 모든 팀 채널 참여', member: '소속·공개 채널 참여', guest: '현장 지원 등 협력 채널만' };
    // Count members per role from the loaded users list.
    const roleCount = { admin: 0, lead: 0, member: 0, guest: 0 };
    Object.keys(s.usersById).forEach(id => { const r = s.usersById[id].role; if (roleCount[r] != null) roleCount[r]++; });
    const roleDefs = roleOrder.map(r => ({ id: r, name: roleName[r], color: roleColor[r], count: roleCount[r], desc: roleDesc[r] }));
    // Permission matrix is admin-only data (rawPerms). Only channels (not DMs) are shown.
    const permRows = (s.rawPerms || []).filter(p => p.kind === 'channel').map(p => {
      const ch = (s.rawChannels || []).find(c => c.id === p.channelId) || {};
      return {
        name: p.name, initial: ch.initial || (p.name ? p.name[0] : '#'), color: ch.color || '#5B636B',
        cells: roleOrder.map(r => {
          const cell = (p.roles || []).find(x => x.role === r) || {};
          const v = !!cell.canView; const se = !!cell.canSend;
          return {
            onView: () => this.togglePerm(p.channelId, r, 'view'),
            onSend: () => this.togglePerm(p.channelId, r, 'send'),
            viewStyle: 'width:30px;height:26px;border-radius:7px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:' + (v ? '#fff' : '#B6BDC5') + ';background:' + (v ? '#2563EB' : '#EEF1F4') + ';',
            sendStyle: 'width:30px;height:26px;border-radius:7px;border:none;cursor:pointer;display:flex;align-items:center;justify-content:center;color:' + (se ? '#fff' : '#B6BDC5') + ';background:' + (se ? '#15A66A' : '#EEF1F4') + ';',
          };
        }),
      };
    });

    // GitLab repos are empty (no token) → graceful "미연동" state.
    const repoList = this.repoMeta();
    const hasRepos = repoList.length > 0;

                        <div style={css(`font-size: 11.5px; color: #A2AAB2; margin-top: 3px;`)}>{n.team} · {n.time}</div>
                      </div>
                    ))}
                  </div>
                </div>
                )}

                {/* mobile chat */}
                {mIsChat && (
                <div style={css(`display: flex; flex-direction: column; height: 100%;`)}>
                  <div style={css(`padding: 8px 18px 12px; display: flex; align-items: center; gap: 10px; border-bottom: 1px solid #EFF1F4; background: #fff;`)}>
                    <span style={css(`width: 30px; height: 30px; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 700; color: #fff; background: ${currentChannel.color};`)}>{currentChannel.initial}</span>
                    <div><div style={css(`font-size: 14.5px; font-weight: 700;`)}>{currentChannel.name}</div><div style={css(`font-size: 11px; color: #8A929B;`)}>{currentChannel.members ? currentChannel.members + '명' : '채널 대화'}</div></div>
                  </div>
                  <div style={css(`flex: 1; overflow-y: auto; padding: 16px 16px; background: #F4F6F8; display: flex; flex-direction: column; gap: 14px;`)}>
                    {messages.map((m) => (
                      <div key={m.id} style={css(`display: flex; gap: 9px;`)}>
                        <span style={css(`width: 32px; height: 32px; flex: none; border-radius: 9px; background: ${m.color}; color: #fff; display: flex; align-items: center; justify-content: center; font-size: 12px; font-weight: 700;`)}>{m.initial}</span>
                        <div style={css(`min-width: 0; flex: 1;`)}>
                          <div style={css(`font-size: 12.5px; font-weight: 700;`)}>{m.author} <span style={css(`font-size: 10.5px; color: #A2AAB2; font-weight: 400;`)}>{m.time}</span>
                            {m.canEdit && (<button onClick={m.onEdit} className="hc-blue" style={css(`border: none; background: transparent; cursor: pointer; font-size: 10.5px; color: #B6BDC5; padding: 0; font-weight: 600;`)}>수정</button>)}
                          </div>
                          {m.isEditing && (
                            <div style={css(`margin-top: 4px; display: flex; flex-direction: column; gap: 6px;`)}>
                              <input value={editDraft} onChange={onEditChange} onKeyDown={onEditKey} style={css(`border: 1px solid #2563EB; border-radius: 9px; padding: 7px 10px; font-size: 13.5px; outline: none;`)} />
                              <div style={css(`display: flex; gap: 6px;`)}><button onClick={saveEdit} style={css(`border: none; background: #2563EB; color: #fff; font-size: 11.5px; font-weight: 600; padding: 5px 12px; border-radius: 7px; cursor: pointer;`)}>저장</button><button onClick={cancelEdit} style={css(`border: 1px solid #DDE1E6; background: #fff; color: #5B636B; font-size: 11.5px; font-weight: 600; padding: 5px 12px; border-radius: 7px; cursor: pointer;`)}>취소</button></div>
                            </div>
                          )}
                          {m.showText && (<Fragment><div style={css(`font-size: 13.5px; line-height: 1.5; color: #2B3138; background: #fff; border-radius: 11px; padding: 9px 12px; margin-top: 4px; display: inline-block;`)}>{m.text}<span style={css(`font-size: 10.5px; color: #A2AAB2; margin-left: 5px;`)}>{m.editedSuffix}</span></div>{m.editedFlag && (<div style={css(`margin-top: 4px; font-size: 11.5px; color: #9098A0; background: #EEF1F4; border-radius: 8px; padding: 6px 10px;`)}><b style={css(`color: #8A929B;`)}>수정 전</b> · {m.prevText}</div>)}</Fragment>)}
                          {m.hasImages && m.images.map((im, ii) => (<div key={'mi' + ii} style={css(`margin-top: 5px;`)}>{im.url ? (<img src={im.url} alt={im.name} onClick={im.onDownload} title="받기" style={css(`max-width: 200px; max-height: 220px; border-radius: 11px; display: block; cursor: pointer;`)} />) : (<div style={css(`width: 160px; height: 100px; border-radius: 11px; background: #E6EAEF; display: flex; align-items: center; justify-content: center; font-size: 10px; color: #9AA3AC;`)}>불러오는 중…</div>)}</div>))}
                          {m.hasDocs && m.docs.map((d, di) => (<button key={'md' + di} onClick={d.onDownload} style={css(`margin-top: 5px; display: flex; align-items: center; gap: 9px; background: #fff; border: none; border-radius: 11px; padding: 9px 11px; cursor: pointer; text-align: left; width: 100%; max-width: 240px;`)}><span style={css(`width: 30px; height: 30px; border-radius: 8px; background: #EEF3FF; color: #2563EB; display: flex; align-items: center; justify-content: center; font-size: 9px; font-weight: 800;`)}>{d.ext || 'FILE'}</span><div style={css(`flex: 1; min-width: 0;`)}><div style={css(`font-size: 12px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;`)}>{d.name}</div><div style={css(`font-size: 10.5px; color: #15A66A; font-weight: 700;`)}>영구 보관 · 받기</div></div></button>))}
                        </div>
                      </div>
                    ))}
                  </div>
                  {canSendCurrent && (
                  <div style={css(`flex: none; padding: 10px 14px; background: #fff; border-top: 1px solid #EFF1F4; display: flex; gap: 8px; align-items: center;`)}>
                    <input value={draft} onChange={onDraft} onKeyDown={onDraftKey} placeholder="메시지 입력" style={css(`flex: 1; border: 1px solid #DDE1E6; border-radius: 20px; padding: 10px 14px; font-size: 13.5px; outline: none;`)} />
                    <button onClick={sendMessage} style={css(`border: none; background: #2563EB; color: #fff; width: 38px; height: 38px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center;`)}><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m22 2-7 20-4-9-9-4Z"/><path d="M22 2 11 13"/></svg></button>
                  </div>
                  )}
                  {readOnlyCurrent && (
                  <div style={css(`flex: none; padding: 13px 16px; background: #fff; border-top: 1px solid #EFF1F4; display: flex; gap: 9px; align-items: center; color: #8A929B;`)}>
                    <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="11" x="3" y="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>
                    <span style={css(`font-size: 12.5px; line-height: 1.4;`)}>읽기 전용 채널입니다.</span>
                  </div>
                  )}
                </div>
                )}

                {/* mobile issues */}
                {mIsIssues && (
                <div style={css(`padding: 6px 18px 24px;`)}>
                  <div style={css(`font-size: 18px; font-weight: 700; margin: 6px 0 14px;`)}>내 이슈</div>
                  <div style={css(`display: flex; flex-direction: column; gap: 10px;`)}>
                    {mobileIssues.map((card) => (
                      <div key={card.key} style={css(`background: #fff; border-radius: 13px; padding: 14px 15px;`)}>
                        <div style={css(`display: flex; align-items: center; gap: 7px; margin-bottom: 8px;`)}>
                          <span style={css(`font-size: 11px; font-weight: 600; color: ${card.labelColor}; background: ${card.labelBg}; padding: 2px 8px; border-radius: 6px;`)}>{card.label}</span>
                          <span style={css(`width: 6px; height: 6px; border-radius: 50%; background: ${card.prColor};`)}></span>
                          <span style={css(`font-size: 11px; color: #A2AAB2;`)}>{card.statusLabel}</span>
                        </div>
                        <div style={css(`font-size: 14px; font-weight: 600; line-height: 1.4;`)}>{card.title}</div>
                        <div style={css(`font-size: 11.5px; font-weight: 700; color: #8A929B; margin-top: 8px;`)}>{card.key} · {card.assignee}</div>
                      </div>
                    ))}
                  </div>
                </div>
                )}

                {/* mobile work */}
                {mIsWork && (
                <div style={css(`padding: 6px 18px 24px;`)}>
                  <div style={css(`font-size: 18px; font-weight: 700; margin: 6px 0 14px;`)}>근태</div>
                  <div style={css(`background: ${checkColor}; border-radius: 16px; padding: 18px; color: #fff; text-align: center; margin-bottom: 18px;`)}>
                    <div style={css(`font-size: 12px; opacity: 0.85;`)}>{workedText}</div>
                    <div style={css(`font-size: 22px; font-weight: 700; margin: 4px 0 14px;`)}>{checkInLabel}</div>
                    <button onClick={onCheckIn} style={css(`border: none; background: rgba(255,255,255,0.22); color: #fff; font-size: 15px; font-weight: 700; padding: 12px 0; border-radius: 12px; cursor: pointer; width: 100%;`)}>{checkBtnLabel}</button>
                  </div>
                  <div style={css(`font-size: 14px; font-weight: 700; margin-bottom: 10px;`)}>이번 주</div>
                  <div style={css(`background: #fff; border-radius: 14px; padding: 4px 16px;`)}>
                    {attendance.map((d) => (
                      <div key={d.date} style={css(`display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid #F4F6F8;`)}>
                        <span style={css(`font-size: 13px; font-weight: 700; width: 48px;`)}>{d.day} {d.date}</span>
                        <span style={css(`flex: 1; font-size: 13px; color: #4B535B; font-variant-numeric: tabular-nums;`)}>{d.in} – {d.out}</span>
                        <span style={css(`font-size: 11px; font-weight: 700; color: ${d.statusColor}; background: ${d.statusBg}; padding: 2px 9px; border-radius: 6px;`)}>{d.status}</span>
                      </div>
                    ))}
                  </div>
                </div>
                )}
              </div>

              {/* bottom tabs */}
              <div style={css(`flex: none; height: 64px; background: #fff; border-top: 1px solid #EFF1F4; display: flex; padding-bottom: 6px;`)}>
                <button onClick={mTabHome} style={css(mTab.home)}>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><path d="M9 22V12h6v10"/></svg>
                  <span style={css(`font-size: 10px; font-weight: 600;`)}>홈</span>
                </button>
                <button onClick={mTabChat} style={css(mTab.chat)}>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
                  <span style={css(`font-size: 10px; font-weight: 600;`)}>채팅</span>
                </button>
                <button onClick={mTabIssues} style={css(mTab.issues)}>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M8 7v7"/><path d="M12 7v4"/><path d="M16 7v9"/></svg>
                  <span style={css(`font-size: 10px; font-weight: 600;`)}>이슈</span>
                </button>
                <button onClick={mTabWork} style={css(mTab.work)}>
                  <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v4"/><path d="M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/><path d="m9 16 2 2 4-4"/></svg>
                  <span style={css(`font-size: 10px; font-weight: 600;`)}>근태</span>
                </button>
              </div>
            </div>
          </div>
        </div>
        )}

      </div>
    );
  }
}

const root = ReactDOM.createRoot(document.getElementById('root'));
root.render(<App />);
</script>
<script>
  // Register service worker for offline app-shell caching (no-op under file://).
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function () {
      navigator.serviceWorker.register('./sw.js').catch(function () {});
    });
  }
</script>
</body>
</html>
